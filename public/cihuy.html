function sess(qs,o,back='train'){A.innerHTML='<div id="qz"></div>';if(!qs.length){A.innerHTML=`<div class="card ctr">Belum ada soal. 🎉</div><button class="btn" onclick="go('${back}')">Kembali</button>`;return}
 quiz(qs,$('#qz'),(ok,n,wr)=>{$('#qz').innerHTML=res(ok,n,wr)+`<button class="btn" onclick="go('${back}')">Selesai</button></div>`},o)}
function mcq(x,k,pool=ALL){const f={a:2,p:1,h:0}[k],d=SH(pool.filter(y=>y[f]!=x[f])).filter((y,i,a)=>a.findIndex(z=>z[f]==y[f])==i).slice(0,3);return{m:0,t:'m',q:k=='a'?`Arti ${x[0]}?`:k=='p'?`Pinyin ${x[0]}?`:`Hanzi untuk “${x[2]}”?`,o:[x[f],...d.map(y=>y[f])],a:x[f],e:`${x[0]} (${x[1]}) = ${x[2]}`}}
function mode(k){
 if(k=='fl')return fcard();if(k=='mt')return matchG();if(k=='mist')return go('mist');
 if(k=='pn')return sess(SH(ALL).slice(0,10).map(x=>mcq(x,'p')),{});
 if(k=='tl')return sess(SH(TR).map(t=>({m:0,t:'m',q:t[0],o:[t[1],...SH(TR.filter(y=>y!=t)).slice(0,3).map(y=>y[1])],a:t[1],e:t[0]+' = '+t[1]})),{});
 if(k=='fi')return sess(SH(FILL),{});
 if(k=='sp'){A.innerHTML='<div class="card"><h3>⚡ Speed Quiz</h3>Waktu per soal:<select id="tt"><option>5</option><option selected>8</option><option>12</option><option>20</option></select><button class="btn" id="go1" style="margin-top:10px">Mulai</button></div>';$('#go1').onclick=()=>sess(SH(ALL).slice(0,12).map(x=>mcq(x,R(['a','p','h']))),{time:+$('#tt').value,sa:0})}}
function revm(due){sess(Object.values(S.mist).filter(m=>!due||m.due<=Date.now()).map(m=>m.q),{rev:1},'mist')}
function rnd(){const i=Math.random()*12|0;const qs=Q.filter(x=>x.m==i+1);A.innerHTML=`<div class="card"><b>🎲 Random Review: ${MODS[i].i} ${MODS[i].t}</b></div><div id="qz"></div>`;quiz(SH(qs),$('#qz'),(ok,n,wr)=>{$('#qz').innerHTML=res(ok,n,wr)+'<button class="btn" onclick="go(\'home\')">Selesai</button></div>'},{})}
function doExam(){const qs=SH(Q);A.innerHTML='<div id="qz"></div>';quiz(qs,$('#qz'),(ok,n,wr)=>{const p=Math.round(ok/n*100);S.best=Math.max(S.best,p);sv();$('#qz').innerHTML=res(ok,n,wr)+`<h3>Nilai: ${p}</h3><button class="btn" onclick="doExam()">Ulangi</button><button class="btn g" onclick="go('exam')">Selesai</button></div>`},{})}
function fcard(){let d=SH(FLASH),i=0,fl=0;const u=()=>{if(i>=d.length){A.innerHTML=`<div class="card ctr"><div class="big">🎉</div><h3>Semua kartu selesai!</h3><button class="btn" onclick="fcard()">Acak lagi</button><button class="btn g" onclick="go('train')">Kembali</button></div>`;return}const x=d[i];
 A.innerHTML=`<div class="card ctr fi" id="cd" style="cursor:pointer;min-height:230px"><div class="m">Kartu ${i+1}/${d.length} — tebak artinya dulu, lalu tap kartu</div><div class="hz" style="font-size:80px;margin:18px 0">${x[0]}</div>${fl?`<div class="py" style="font-size:22px">${x[1]}</div><div style="font-size:18px">${x[2]}</div><button class="btn g" onclick="event.stopPropagation();say('${x[0]}')">🔊</button>`:''}</div>${fl?'<div class="ctr"><button class="btn" id="kn">Sudah hafal ✓</button><button class="btn g" id="uk">Belum ✗</button></div>':''}`;
 $('#cd').onclick=()=>{if(!fl){fl=1;u()}};if(fl){$('#kn').onclick=()=>{delete S.unk[x[0]];sv();i++;fl=0;u()};$('#uk').onclick=()=>{S.unk[x[0]]=1;sv();d.push(x);i++;fl=0;u()}}};u()}
function matchG(){const w=SH(ALL.filter((x,i,a)=>a.findIndex(y=>y[2]==x[2])==i)).slice(0,5);let L=null,n=0;
 A.innerHTML=`<div class="card"><b>🔗 Cocokkan Hanzi dengan arti</b><div class="row" style="align-items:flex-start"><div id="l"></div><div id="r"></div></div><div id="mm" class="ctr"></div></div>`;
 const add=(c,t,k)=>{SH(w).forEach(x=>{const b=document.createElement('button');b.className='opt s';b.textContent=k?x[2]:x[0]+'  '+x[1];b.dataset.k=x[0];b.onclick=()=>{if(b.disabled)return;if(!k){[...$('#l').children].forEach(z=>z.style.outline='');L=b;b.style.outline='2px solid var(--p)';return}if(!L)return;if(L.dataset.k==b.dataset.k){L.classList.add('ok');b.classList.add('ok');L.disabled=b.disabled=true;L.style.outline='';L=null;S.score+=5;sv();if(++n==5)$('#mm').innerHTML='🎉 Semua cocok! <button class="btn" onclick="matchG()">Main lagi</button>'}else{b.classList.add('no');S.bad++;sv();setTimeout(()=>b.classList.remove('no'),400)}};$(c).appendChild(b)})};add('#l',0,0);add('#r',0,1)}
go('home');
</script></body></html>
